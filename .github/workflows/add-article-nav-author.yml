name: Add article navigation and author
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update article
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('posts/ai-adoption-india.html');s=p.read_text(encoding='utf-8')
          if 'article-side-nav-v2' in s: raise SystemExit('already done')
          css='''<style id="article-side-nav-v2">.article-side{position:fixed;left:max(10px,calc(50% - 620px));top:42%;z-index:20;display:flex;flex-direction:column;gap:6px}.article-side a{width:28px;height:28px;display:grid;place-items:center;border:1px solid #38bdf855;border-radius:8px;background:#0b1220e8;color:#9bdcff;font:10px var(--mono);box-shadow:0 5px 18px #0005;transition:.2s}.article-side a:hover{transform:translateX(3px);text-decoration:none;border-color:#38bdf8}.author-end{margin:52px 0 0;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:center}.author-end img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}.author-end strong{display:block;margin:8px 0 3px}.author-end small{color:var(--muted)}.author-links,.related-grid{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.author-links a,.related-grid a{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:11px var(--mono)}.related-end{margin-top:34px}.related-end h3{margin-bottom:10px}.related-grid a{color:var(--text);background:var(--surface)}@media(max-width:1050px){.article-side{display:none}}@media(prefers-reduced-motion:reduce){.article-side a{transition:none}}</style>'''
          nav='''<nav class="article-side" aria-label="Article section navigation"></nav>'''
          related='''<section class="related-end" aria-label="Related articles"><h3>Related Articles</h3><div class="related-grid"><a href="/posts/agentic-ai.html">Agentic AI</a><a href="/posts/genai-prompts-production.html">Generative AI</a><a href="/posts/deep-learning-fundamentals.html">Deep Learning</a><a href="/blog.html">All Articles</a></div></section>'''
          author='''<div class="author-end"><img src="/images/profile.jpg" alt="Suraj Pandey"><strong>Suraj Pandey</strong><small>Political Science • AI • Technology &amp; Geopolitics</small><div class="author-links"><a href="/">Home</a><a href="/">My Identity</a><a href="/blog.html">Read More Articles</a></div></div>'''
          js='''<script id="article-side-nav-js-v2">(()=>{const n=document.querySelector('.article-side');if(!n)return;document.querySelectorAll('h2').forEach((h,i)=>{if(i>8)return;if(!h.id)h.id='article-section-'+(i+1);const a=document.createElement('a');a.href='#'+h.id;a.textContent=i+1;a.title=h.textContent.trim();n.appendChild(a)})})();</script>'''
          s=s.replace('</body>',css+nav+related+author+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('posts/ai-adoption-india.html').read_text(encoding='utf-8')
          checks=['article-side-nav-v2','Related Articles','Suraj Pandey','Read More Articles','href="/"','/posts/agentic-ai.html']
          assert all(x in s for x in checks),'validation failed'
          assert s.count('</html>')==1,'html closing tag check failed'
          print('VALIDATION OK')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add posts/ai-adoption-india.html
          git commit -m 'Add compact article navigation and author footer' || true
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/add-article-nav-author.yml
          git commit -m 'Remove one-time article navigation workflow'
          git push
