name: Upgrade AI Article Observatory
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ai-observatory-main
  queue: max
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build premium interactive article
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('posts/ai-adoption-india.html')
          s=p.read_text(encoding='utf-8')
          marker='ai-observatory-v3'
          if marker in s:
              print('AI Observatory v3 already present; nothing to do.')
              raise SystemExit(0)

          required=['<article class="article">','<div class="meta">','</article>','</body>']
          if not all(x in s for x in required):
              raise SystemExit('Required article structure missing; refusing to modify.')

          # Remove the previous experimental cards, including the malformed FAQ placement.
          s=re.sub(r'\s*<aside class="ai-flow-card ai-flow-top-card" id="ai-flow-cards-v2".*?</aside>', '', s, flags=re.S)
          s=re.sub(r'\s*<aside class="ai-flow-card ai-section-flow".*?</aside>', '', s, flags=re.S)
          s=re.sub(r'/\* ai-flow-cards-v2 \*/.*?@media\(prefers-reduced-motion:reduce\)\{.*?\}\s*', '', s, flags=re.S)
          s=re.sub(r'\s*<style id="apa-reference-style">', '<style id="apa-reference-style">', s, count=1)

          # Repair repeated TOC entries left by earlier iterations.
          s=re.sub(r'(<a href="#research-update-2026">2026 Evidence Update</a>){2,}', r'\1', s)

          css=r'''/* ai-observatory-v3 */
          :root{--ao-bg:#f7f4ee;--ao-ink:#17191d;--ao-muted:#68717d;--ao-line:#d8d4cb;--ao-panel:#07101c;--ao-panel2:#0d1a2b;--ao-cyan:#67d9ff;--ao-violet:#9b8cff;--ao-orange:#ffb45e;--ao-green:#76e0a8}
          .ao-viz{position:relative;overflow:hidden;margin:32px 0 48px;border:1px solid #253246;border-radius:24px;background:linear-gradient(135deg,var(--ao-panel),var(--ao-panel2));color:#edf6ff;box-shadow:0 24px 70px #07101c1c;isolation:isolate}
          .ao-viz:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#67d9ff08 1px,transparent 1px),linear-gradient(#67d9ff08 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 90%);pointer-events:none}
          .ao-viz-head{position:relative;z-index:2;padding:25px 25px 10px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
          .ao-kicker{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--ao-cyan)}
          .ao-viz h3{margin:7px 0 8px;color:#fff;font:700 clamp(1.35rem,2.5vw,2rem) Fraunces,Georgia,serif}
          .ao-viz p{margin:0;color:#aebed0;font:13px/1.65 'IBM Plex Sans',sans-serif}
          .ao-badge{padding:8px 10px;border:1px solid #ffffff1c;border-radius:999px;background:#ffffff08;font:700 9px 'IBM Plex Mono',monospace;color:#cfe5f7;white-space:nowrap}
          .ao-body{position:relative;z-index:2;padding:18px 25px 25px}.ao-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
          .ao-canvas-wrap{height:230px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff04;overflow:hidden}.ao-canvas-wrap canvas{display:block;width:100%;height:100%}
          .ao-bars{display:grid;gap:14px;align-content:center}.ao-bar-row{display:grid;grid-template-columns:74px 1fr 45px;gap:10px;align-items:center;font:10px 'IBM Plex Mono',monospace;color:#b9c9da}.ao-track{height:10px;border-radius:99px;background:#ffffff0c;overflow:hidden}.ao-fill{width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ao-cyan),var(--ao-violet),var(--ao-orange));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
          .ao-source{margin-top:17px;color:#7f93a9!important;font:10px/1.55 'IBM Plex Mono',monospace!important}.ao-source strong{color:#b8c9db}
          .ao-flow{display:grid;grid-template-columns:repeat(7,1fr);align-items:center;gap:7px;margin-top:16px}.ao-step{min-height:78px;display:grid;place-items:center;text-align:center;padding:10px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff07;color:#e9f4ff;font:700 10px 'IBM Plex Mono',monospace;box-shadow:0 0 30px #67d9ff0b;transition:.25s ease}.ao-step span{display:block;margin-top:4px;color:#7890a8;font:9px 'IBM Plex Mono',monospace}.ao-step:hover{transform:translateY(-3px);border-color:#67d9ff55;box-shadow:0 14px 35px #67d9ff12}.ao-arrow{height:1px;background:linear-gradient(90deg,#67d9ff55,#9b8cff88,#ffb45e55);position:relative}.ao-arrow:after{content:'';position:absolute;left:-20%;top:-2px;width:22%;height:5px;background:#fff;filter:blur(2px);animation:ao-scan 2.6s linear infinite}.ao-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.ao-metric{padding:17px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff05}.ao-metric strong{display:block;font:700 clamp(1.5rem,3vw,2.2rem) Fraunces,Georgia,serif;color:#fff}.ao-metric span{display:block;margin-top:4px;color:#94a9be;font:9px/1.45 'IBM Plex Mono',monospace;text-transform:uppercase}.ao-stack{display:grid;gap:8px;margin-top:15px}.ao-stack-item{position:relative;display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border:1px solid #ffffff14;border-radius:14px;background:linear-gradient(90deg,#ffffff07,transparent);font:700 11px 'IBM Plex Mono',monospace;letter-spacing:.4px;overflow:hidden}.ao-stack-item:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ao-cyan),var(--ao-violet),var(--ao-orange))}.ao-stack-item small{color:#8398ae;font:9px 'IBM Plex Mono',monospace}.ao-node-map{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.ao-node{padding:15px 10px;text-align:center;border:1px solid #ffffff13;border-radius:14px;background:#ffffff05;font:700 10px 'IBM Plex Mono',monospace;color:#d9e8f6;transition:.25s ease}.ao-node:after{content:'•';display:block;margin-top:6px;color:var(--ao-cyan);animation:ao-blink 2.5s ease-in-out infinite}.ao-node:hover{transform:translateY(-3px);border-color:#67d9ff55;background:#67d9ff09}.ao-scenarios{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.ao-scenario{padding:18px;border:1px solid #ffffff14;border-radius:16px;background:#ffffff05;transition:.25s ease}.ao-scenario b{display:block;color:#fff;font:700 10px 'IBM Plex Mono',monospace}.ao-scenario strong{display:block;margin:9px 0 5px;color:#dff4ff;font:700 18px Fraunces,serif}.ao-scenario p{font-size:11px}.ao-scenario:hover{transform:translateY(-4px);border-color:#9b8cff55;box-shadow:0 15px 40px #9b8cff0d}.ao-footnote{margin-top:15px;color:#7e93aa!important;font:10px/1.55 'IBM Plex Mono',monospace!important}.ao-viz .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
          @keyframes ao-scan{to{left:110%}}@keyframes ao-blink{0%,100%{opacity:.3}50%{opacity:1}}
          @media(max-width:760px){.ao-grid{grid-template-columns:1fr}.ao-metrics{grid-template-columns:1fr 1fr}.ao-node-map{grid-template-columns:1fr 1fr}.ao-scenarios{grid-template-columns:1fr 1fr}.ao-flow{grid-template-columns:1fr}.ao-arrow{height:20px;width:1px;margin:auto}.ao-viz-head{flex-direction:column}.ao-badge{white-space:normal}}
          @media(prefers-reduced-motion:reduce){.ao-arrow:after,.ao-node:after{animation:none}.ao-fill{transition:none}.ao-step:hover,.ao-node:hover,.ao-scenario:hover{transform:none}}
          '''
          s=s.replace('</style>',css+'</style>',1)

          visual1=r'''<aside class="ao-viz" id="ai-observatory-v3" aria-label="Interactive comparison of Frontier Professional shares">
          <div class="ao-viz-head"><div><div class="ao-kicker">Executive signal · 2026 evidence</div><h3>India is moving from AI experimentation to everyday work</h3><p>Microsoft's 2026 survey found a higher Frontier Professional share among AI-using knowledge workers in India than the global average.</p></div><div class="ao-badge">OBSERVED DATA</div></div>
          <div class="ao-body"><div class="ao-grid"><div class="ao-canvas-wrap"><canvas data-ao-viz="network" aria-hidden="true"></canvas></div><div class="ao-bars"><div class="ao-bar-row"><span>India</span><div class="ao-track"><div class="ao-fill" data-value="32"></div></div><b>32%</b></div><div class="ao-bar-row"><span>Global</span><div class="ao-track"><div class="ao-fill" data-value="16"></div></div><b>16%</b></div></div></div><p class="ao-source"><strong>Definition:</strong> Frontier Professionals among AI-using knowledge workers in the study — not 32% of all Indian workers. <strong>Source:</strong> Microsoft Work Trend Index 2026.</p></div></aside>'''

          visual2=r'''<aside class="ao-viz" aria-label="Analytical adoption capability value governance framework"><div class="ao-viz-head"><div><div class="ao-kicker">The argument in one system</div><h3>Adoption is only the beginning</h3><p>Usage becomes meaningful only when organisations can build capability, demonstrate value and govern the resulting systems.</p></div><div class="ao-badge">CONCEPTUAL FRAMEWORK</div></div><div class="ao-body"><div class="ao-flow"><div class="ao-step">ADOPTION<span>use</span></div><div class="ao-arrow"></div><div class="ao-step">CAPABILITY<span>skills</span></div><div class="ao-arrow"></div><div class="ao-step">VALUE<span>outcomes</span></div><div class="ao-arrow"></div><div class="ao-step">GOVERNANCE<span>trust</span></div></div><p class="ao-footnote">Analytical framework — not a statistical series. It is used to interpret why high adoption should not automatically be read as high productivity.</p></div></aside>'''

          visual3=r'''<aside class="ao-viz" aria-label="IndiaAI Mission infrastructure visualization"><div class="ao-viz-head"><div><div class="ao-kicker">IndiaAI Mission · enabling layer</div><h3>Building the infrastructure behind adoption</h3><p>The mission links compute, data, models, skills, startups and safety rather than treating AI as a single software product.</p></div><div class="ao-badge">OFFICIAL PROGRAMME DATA</div></div><div class="ao-body"><div class="ao-metrics"><div class="ao-metric"><strong>₹10,371.92 Cr</strong><span>five-year mission outlay</span></div><div class="ao-metric"><strong>38,000+</strong><span>GPUs onboarded</span></div><div class="ao-metric"><strong>7</strong><span>mission pillars</span></div><div class="ao-metric"><strong>20,000</strong><span>additional GPUs announced / under process</span></div></div><div class="ao-stack"><div class="ao-stack-item">COMPUTE <small>infrastructure access</small></div><div class="ao-stack-item">DATA &amp; MODELS <small>AIKosh · foundation models</small></div><div class="ao-stack-item">SKILLS &amp; STARTUPS <small>future skills · financing</small></div><div class="ao-stack-item">SAFE &amp; TRUSTED AI <small>evaluation · governance</small></div></div><p class="ao-source"><strong>Source:</strong> IndiaAI Mission / PIB. The additional 20,000 GPUs are not counted here as deployed capacity.</p></div></aside>'''

          visual4=r'''<aside class="ao-viz" aria-label="Conceptual AI geopolitical power stack"><div class="ao-viz-head"><div><div class="ao-kicker">Geopolitical capability stack</div><h3>AI power is built in layers</h3><p>Control over technical and institutional layers can shape strategic autonomy, standards and bargaining power.</p></div><div class="ao-badge">CONCEPTUAL FRAMEWORK</div></div><div class="ao-body"><div class="ao-stack"><div class="ao-stack-item">CHIPS <small>hardware supply</small></div><div class="ao-stack-item">COMPUTE <small>cloud · data centres · energy</small></div><div class="ao-stack-item">DATA <small>quality · access · governance</small></div><div class="ao-stack-item">MODELS <small>research · evaluation</small></div><div class="ao-stack-item">TALENT <small>scientists · engineers · institutions</small></div><div class="ao-stack-item">STANDARDS <small>rules · interoperability · safety</small></div><div class="ao-stack-item">GEOPOLITICAL POWER <small>strategic agency</small></div></div><p class="ao-footnote">This stack explains relationships; it does not assign numerical scores to countries.</p></div></aside>'''

          usemap=r'''<aside class="ao-viz" aria-label="Conceptual map of AI use cases"><div class="ao-viz-head"><div><div class="ao-kicker">AI across everyday systems</div><h3>Adoption spreads through tasks, not one industry</h3><p>These are use-case categories, not a ranked dataset. The visual intentionally avoids invented adoption percentages.</p></div><div class="ao-badge">CONCEPTUAL MAP</div></div><div class="ao-body"><div class="ao-node-map">'''+''.join(f'<div class="ao-node">{x}</div>' for x in ['PRODUCTIVITY','CODING','CUSTOMER SERVICE','RESEARCH','HEALTHCARE','EDUCATION','FINANCE','PUBLIC ADMIN'])+r'''</div></div></aside>'''

          riskmap=r'''<aside class="ao-viz" aria-label="Analytical AI risk map"><div class="ao-viz-head"><div><div class="ao-kicker">Risk surface</div><h3>The costs are real too</h3><p>Rapid deployment can amplify existing social and institutional weaknesses. The map shows risk domains without pretending they have measured percentages.</p></div><div class="ao-badge">ANALYTICAL MAP</div></div><div class="ao-body"><div class="ao-node-map">'''+''.join(f'<div class="ao-node">{x}</div>' for x in ['MISINFORMATION','JOB DISPLACEMENT','BIAS','PRIVACY','CYBERSECURITY','POWER CONCENTRATION','HALLUCINATION','INEQUALITY'])+r'''</div></div></aside>'''

          political=r'''<aside class="ao-viz" aria-label="Political science and AI relationship map"><div class="ao-viz-head"><div><div class="ao-kicker">Humanities × technology</div><h3>Why AI is a Political Science question</h3><p>AI changes who controls information, infrastructure and decision systems — making power, institutions and accountability central to the analysis.</p></div><div class="ao-badge">CONCEPTUAL MAP</div></div><div class="ao-body"><div class="ao-node-map">'''+''.join(f'<div class="ao-node">{x}</div>' for x in ['POWER','STATE','GOVERNANCE','DEMOCRACY','LABOUR','INSTITUTIONS','INFORMATION'])+r'''</div></div></aside>'''

          scenarios=r'''<aside class="ao-viz" aria-label="Four AI future scenarios"><div class="ao-viz-head"><div><div class="ao-kicker">Scenario lab</div><h3>Four plausible futures</h3><p>These are analytical scenarios, not predictions. Their purpose is to make trade-offs visible.</p></div><div class="ao-badge">SCENARIO FRAMEWORK</div></div><div class="ao-body"><div class="ao-scenarios"><div class="ao-scenario"><b>01</b><strong>Controlled Adoption</strong><p>Human oversight stays central while AI use expands cautiously.</p></div><div class="ao-scenario"><b>02</b><strong>Agentic Acceleration</strong><p>Multi-step AI workflows spread and supervision becomes a core skill.</p></div><div class="ao-scenario"><b>03</b><strong>Fragmented AI World</strong><p>Standards, infrastructure and models become more regionally divided.</p></div><div class="ao-scenario"><b>04</b><strong>Broad AI Capability</strong><p>Access widens and institutions adapt around reliable AI systems.</p></div></div></div></aside>'''

          priority=r'''<aside class="ao-viz" aria-label="India AI priority ladder"><div class="ao-viz-head"><div><div class="ao-kicker">Policy priority ladder</div><h3>From infrastructure to human oversight</h3><p>A practical sequence for turning adoption into durable national capability.</p></div><div class="ao-badge">POLICY FRAMEWORK</div></div><div class="ao-body"><div class="ao-stack">'''+''.join(f'<div class="ao-stack-item">{i:02d} · {x}</div>' for i,x in enumerate(['Compute','Data','Skills','Reliable Models','Governance','Public Institutions','Human Oversight'],1))+r'''</div></div></aside>'''

          # Insert the executive signal after metadata.
          s=re.sub(r'(<div class="meta">.*?</div>)',r'\1'+visual1,s,count=1,flags=re.S)
          # Place the analytical flow after the first real article heading.
          s=re.sub(r'(<h2 id="why">.*?</h2>)',r'\1'+visual2,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="uses">.*?</h2>)',r'\1'+usemap,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="risks">.*?</h2>)',r'\1'+riskmap,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="mission">.*?</h2>)',r'\1'+visual3,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="politics">.*?</h2>)',r'\1'+political,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="geopolitics">.*?</h2>)',r'\1'+visual4,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="scenarios">.*?</h2>)',r'\1'+scenarios,s,count=1,flags=re.S)
          s=re.sub(r'(<h2 id="priorities">.*?</h2>)',r'\1'+priority,s,count=1,flags=re.S)

          # Remove any accidental old visual placement inside FAQ and add a clean maturity visual before FAQ.
          s=re.sub(r'(<div class="faq-wrap" id="faq">)',visual2+r'\1',s,count=1)
          # Remove the duplicated copy if it was inserted immediately after the FAQ heading in an earlier version.
          s=re.sub(r'(<div class="faq-head">.*?<h2>FAQ</h2>)\s*<aside class="ao-viz".*?</aside>',r'\1',s,count=1,flags=re.S)

          # Add a compact data-driven workforce panel if absent.
          evidence=r'''<aside class="ao-viz" aria-label="2026 India workforce evidence"><div class="ao-viz-head"><div><div class="ao-kicker">Workforce evidence · Microsoft 2026</div><h3>Adoption is becoming organisational behaviour</h3><p>Four survey signals show why India's story is about more than access to AI tools.</p></div><div class="ao-badge">OBSERVED DATA</div></div><div class="ao-body"><div class="ao-metrics"><div class="ao-metric"><strong>78%</strong><span>India AI users: AI enables work not possible a year earlier</span></div><div class="ao-metric"><strong>58%</strong><span>global comparison</span></div><div class="ao-metric"><strong>34%</strong><span>India organisations with agent workflows at function level</span></div><div class="ao-metric"><strong>26%</strong><span>global comparison</span></div></div><p class="ao-source"><strong>Source:</strong> Microsoft Work Trend Index 2026. Survey context: AI-using knowledge workers across 10 markets. The figures are not estimates of India's entire workforce.</p></div></aside>'''
          s=re.sub(r'(<h2 id="workforce">.*?</h2>)',r'\1'+evidence,s,count=1,flags=re.S)

          js=r'''<script id="ai-observatory-script-v3">
          (function(){
            const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const fills=document.querySelectorAll('.ao-fill');
            fills.forEach((el,i)=>{const set=()=>{el.style.width=(el.dataset.value||0)+'%'}; if(reduce)set(); else setTimeout(set,180+i*180)});
            const canvases=document.querySelectorAll('canvas[data-ao-viz="network"]');
            if(!canvases.length||reduce)return;
            const active=new WeakMap();
            function setup(canvas){
              const ctx=canvas.getContext('2d'); if(!ctx)return;
              let w=1,h=1,dpr=1,points=[],running=false,raf=0,last=0,visible=true;
              function resize(){const r=canvas.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.max(18,Math.min(42,Math.floor(w*h/5200)));points=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.7,p:Math.random()*6.28}));}
              function frame(ts){if(!running||!visible)return;const dt=Math.min(32,ts-(last||ts));last=ts;ctx.clearRect(0,0,w,h);for(const p of points){p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.p+=.025;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}for(let i=0;i<points.length;i++){for(let j=i+1;j<points.length;j++){const a=points[i],b=points[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<86){ctx.strokeStyle='rgba(103,217,255,'+(0.17*(1-dist/86))+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}for(const p of points){const glow=1+Math.sin(p.p)*.45;ctx.fillStyle='rgba(155,140,255,.78)';ctx.beginPath();ctx.arc(p.x,p.y,p.r*glow,0,Math.PI*2);ctx.fill()}raf=requestAnimationFrame(frame)}
              function start(){if(running)return;running=true;last=0;raf=requestAnimationFrame(frame)} function stop(){running=false;if(raf)cancelAnimationFrame(raf)}
              resize();window.addEventListener('resize',resize,{passive:true});active.set(canvas,{start,stop,setVisible:v=>{visible=v;if(v)start();else stop()}});start();return {resize};
            }
            canvases.forEach(setup);
            const observer=new IntersectionObserver(entries=>entries.forEach(e=>{const api=active.get(e.target);if(api)api.setVisible(e.isIntersecting)}),{rootMargin:'120px 0px',threshold:.01});
            canvases.forEach(c=>observer.observe(c));
            document.addEventListener('visibilitychange',()=>{canvases.forEach(c=>{const api=active.get(c);if(!api)return;if(document.hidden)api.setVisible(false);else api.setVisible(true)})});
          })();
          </script>'''
          s=s.replace('</body>',js+'</body>',1)

          # Ensure only one Observatory marker and no duplicate script.
          s=re.sub(r'(<script id="ai-observatory-script-v3">).*?</script>\s*(?=<script id="ai-observatory-script-v3">)', '', s, flags=re.S)
          p.write_text(s,encoding='utf-8')
          print('AI Observatory v3 generated.')
      - name: Validate article
        shell: python
        run: |
          from pathlib import Path
          import re, json
          s=Path('posts/ai-adoption-india.html').read_text(encoding='utf-8')
          checks={
            'marker':'ai-observatory-v3' in s,
            'hero_canvas':'id="ai"' in s and '<canvas' in s,
            'visual_32_16':'32%' in s and '16%' in s,
            'visual_78_58':'78%' in s and '58%' in s,
            'visual_34_26':'34%' in s and '26%' in s,
            'mission_outlay':'10,371.92' in s,
            'gpu_onboarded':'38,000+' in s,
            'no_58000_deployed':'58,000 GPUs deployed' not in s,
            'four_visuals':all(x in s for x in ['Executive signal','Adoption is only the beginning','Building the infrastructure behind adoption','AI power is built in layers']),
            'raf':'requestAnimationFrame' in s,
            'reduced_motion':'prefers-reduced-motion' in s,
            'faq':'id="faq"' in s,
            'adsense':'pagead2.googlesyndication.com' in s,
            'cta':'Open Case — Work With Me' in s,
            'html_close':'</html>' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Validation failed: '+', '.join(bad))
          # Basic duplicate-id guard.
          ids=re.findall(r'id="([^"]+)"',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('Duplicate IDs: '+', '.join(dup))
          # Check JSON-LD blocks are parseable.
          for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>',s,re.S):
              json.loads(block)
          print('Validation passed:', ', '.join(k for k,v in checks.items() if v))
      - name: Commit article and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/ai-adoption-india.html
          git rm -f .github/workflows/add-ai-data-visuals.yml
          git commit -m 'Complete AI research observatory article upgrade'
          git push origin HEAD:main
