name: Add AI Data Visuals
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject animated AI observatory
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('posts/ai-adoption-india.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ai-observatory-v1'
          if marker in s:
              raise SystemExit('AI observatory already present; no changes needed.')

          css = r'''/* ai-observatory-v1 */
          .ai-observatory{margin:72px 0 35px;display:grid;gap:22px}.ai-ob-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.ai-ob-head h2{margin:0;border:0;padding:0}.ai-ob-kicker{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange)}.ai-ob-intro{max-width:650px;margin:7px 0 0;font:15px/1.7 'IBM Plex Sans',sans-serif;color:var(--muted)}.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ai-panel{position:relative;overflow:hidden;min-height:285px;padding:22px;border:1px solid #263142;border-radius:22px;background:linear-gradient(145deg,#07101c,#0b1422 55%,#101b2b);color:#eef5ff;box-shadow:0 24px 65px #07101c20}.ai-panel:after{content:'';position:absolute;inset:auto -20% -55% 20%;height:180px;background:radial-gradient(circle,#174b7a55,transparent 65%);pointer-events:none}.ai-panel h3{position:relative;z-index:2;margin:0 0 5px;font:700 12px 'IBM Plex Mono',monospace;letter-spacing:1.2px;text-transform:uppercase;color:#dceaff}.ai-panel p{position:relative;z-index:2;margin:0 0 18px;font:13px/1.55 'IBM Plex Sans',sans-serif;color:#aebbd0}.ai-canvas{position:absolute;inset:72px 0 0;width:100%;height:calc(100% - 72px);display:block}.ai-metric{position:absolute;right:18px;top:18px;z-index:3;font:700 25px Fraunces,Georgia,serif;color:#fff}.ai-label{position:absolute;left:22px;bottom:18px;z-index:3;font:10px 'IBM Plex Mono',monospace;color:#91a4bd;text-transform:uppercase;letter-spacing:.8px}.ai-barbox{position:absolute;z-index:2;left:22px;right:22px;bottom:48px;display:grid;gap:11px}.ai-barrow{display:grid;grid-template-columns:110px 1fr 48px;gap:9px;align-items:center;font:10px 'IBM Plex Mono',monospace;color:#b7c5d7}.ai-bartrack{height:9px;border-radius:99px;background:#ffffff10;overflow:hidden;border:1px solid #ffffff0d}.ai-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4cc9f0,#7c3aed,#f59e0b);box-shadow:0 0 18px #4cc9f044;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}.ai-radar{position:absolute;left:50%;top:58%;width:170px;height:170px;transform:translate(-50%,-50%);border:1px solid #6d86a833;border-radius:50%;box-shadow:0 0 0 30px #ffffff04,0 0 0 60px #ffffff02}.ai-radar:before,.ai-radar:after{content:'';position:absolute;background:#7186a52b}.ai-radar:before{left:50%;top:0;width:1px;height:100%}.ai-radar:after{top:50%;left:0;width:100%;height:1px}.ai-node{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;animation:ai-pulse 1.8s infinite}.ai-node:nth-child(1){left:24%;top:30%}.ai-node:nth-child(2){left:68%;top:27%;animation-delay:.3s}.ai-node:nth-child(3){left:72%;top:67%;animation-delay:.6s}.ai-node:nth-child(4){left:29%;top:70%;animation-delay:.9s}@keyframes ai-pulse{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.35);opacity:1}}.ai-timeline{position:absolute;left:24px;right:24px;bottom:42px;display:flex;align-items:center;gap:0}.ai-tline{height:2px;flex:1;background:linear-gradient(90deg,#4cc9f0,#7c3aed,#f59e0b)}.ai-step{position:relative;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px #ffffff0d,0 0 20px #fff8;flex:none}.ai-step span{position:absolute;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font:9px 'IBM Plex Mono',monospace;color:#8fa2ba}.ai-ob-foot{font:11px/1.6 'IBM Plex Sans',sans-serif;color:var(--muted);padding:13px 15px;border:1px solid var(--line);background:var(--card);border-radius:12px}.ai-ob-foot strong{color:var(--ink)}@media(max-width:720px){.ai-grid{grid-template-columns:1fr}.ai-panel{min-height:270px}.ai-barrow{grid-template-columns:88px 1fr 40px}.ai-timeline{left:18px;right:18px}}@media(prefers-reduced-motion:reduce){.ai-node,.ai-bar{animation:none;transition:none}.ai-canvas{display:none}}
          '''

          html = r'''<section class="ai-observatory" id="ai-observatory-v1" aria-label="Interactive AI data observatory">
            <div class="ai-ob-head"><div><div class="ai-ob-kicker">Interactive evidence layer</div><h2>AI Adoption — See the Numbers Move</h2><p class="ai-ob-intro">A visual reading of the article's key evidence. The animation is decorative, but every displayed number is tied to the cited research in this article.</p></div></div>
            <div class="ai-grid">
              <article class="ai-panel"><div class="ai-metric">32%</div><h3>Frontier Professionals</h3><p>India's share among surveyed AI-using knowledge workers, compared with 16% globally.</p><canvas class="ai-canvas" data-viz="network"></canvas><div class="ai-label">Microsoft Work Trend Index · 2026</div></article>
              <article class="ai-panel"><h3>Adoption Gap</h3><p>India vs global share of AI users classified as Frontier Professionals.</p><div class="ai-barbox"><div class="ai-barrow"><span>India</span><div class="ai-bartrack"><div class="ai-bar" data-width="32"></div></div><b>32%</b></div><div class="ai-barrow"><span>Global</span><div class="ai-bartrack"><div class="ai-bar" data-width="16"></div></div><b>16%</b></div></div><div class="ai-label">Same survey definition · not all workers</div></article>
              <article class="ai-panel"><div class="ai-metric">38K+</div><h3>IndiaAI Compute</h3><p>GPUs onboarded for the national AI compute ecosystem. A further 20,000 were announced in 2026; they are not counted here as deployed.</p><div class="ai-radar"><i class="ai-node"></i><i class="ai-node"></i><i class="ai-node"></i><i class="ai-node"></i></div><div class="ai-label">IndiaAI Mission · compute layer</div></article>
              <article class="ai-panel"><h3>From Adoption to Value</h3><p>The article's analytical framework: using AI is only the first step; value depends on capability, reliability and governance.</p><div class="ai-timeline"><i class="ai-step"><span>ADOPT</span></i><i class="ai-tline"></i><i class="ai-step"><span>CAPABILITY</span></i><i class="ai-tline"></i><i class="ai-step"><span>VALUE</span></i><i class="ai-tline"></i><i class="ai-step"><span>GOVERN</span></i></div><div class="ai-label">Analytical framework · not a statistical series</div></article>
            </div>
            <div class="ai-ob-foot"><strong>Data note:</strong> percentages and GPU figures are shown with their original denominators and status. The 32% figure refers to India's AI-using knowledge workers in Microsoft's 2026 study, while 38K+ refers to GPUs onboarded under IndiaAI. The extra 20K GPUs are intentionally described as announced/under process, not deployed.</div>
          </section>'''

          js = r'''<script>
          /* ai-observatory-v1 runtime: lightweight canvas, no external dependency */
          (function(){
            const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
            document.querySelectorAll('.ai-bar').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.width+'%',180+i*180));
            if(reduce)return;
            document.querySelectorAll('.ai-canvas[data-viz="network"]').forEach(canvas=>{
              const ctx=canvas.getContext('2d'); if(!ctx)return;
              let w=0,h=0,dpr=1,pts=[];
              function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.5);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.max(24,Math.min(70,Math.floor(w*h/9500)));pts=Array.from({length:n},(_,i)=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.8+.7,p:i*1.7}));}
              function frame(t){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;const glow=.35+.2*Math.sin(t*.001+p.p);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(220,235,255,'+glow+')';ctx.fill();}
                for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<92){ctx.strokeStyle='rgba(76,201,240,'+(0.16*(1-dist/92))+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
                requestAnimationFrame(frame);
              }
              resize();addEventListener('resize',resize,{passive:true});requestAnimationFrame(frame);
            });
          })();
          </script>'''

          if '</style>' not in s or '</article>' not in s:
              raise SystemExit('Expected article structure not found; refusing to modify file.')
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('</article>',html+'</article>',1)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/ai-adoption-india.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add advanced animated AI data observatory'
          git push
