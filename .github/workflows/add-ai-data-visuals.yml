name: Add AI Data Visuals
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ai-data-visuals-main
  queue: max
jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build smooth animated information cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('posts/ai-adoption-india.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ai-flow-cards-v2'
          if marker in s:
              raise SystemExit('Animated information cards already present.')

          css = r'''/* ai-flow-cards-v2 */
          .ai-flow-card{position:relative;overflow:hidden;margin:28px 0;padding:24px;border:1px solid #263142;border-radius:22px;background:linear-gradient(135deg,#07101c,#0c1726 60%,#101d2e);color:#eef5ff;box-shadow:0 24px 65px #07101c20}.ai-flow-card:before{content:'';position:absolute;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,#4cc9f044,transparent 68%);pointer-events:none}.ai-flow-inner{position:relative;z-index:2}.ai-flow-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.ai-flow-kicker{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:#8fdcff}.ai-flow-card h3{margin:7px 0 7px;color:#fff;font:700 22px Fraunces,Georgia,serif}.ai-flow-card p{margin:0;max-width:700px;color:#aebbd0;font:13px/1.65 'IBM Plex Sans',sans-serif}.ai-flow-number{font:700 38px Fraunces,Georgia,serif;color:#fff;white-space:nowrap;text-shadow:0 0 25px #4cc9f044}.ai-flow-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;margin-top:20px}.ai-flow-visual{height:145px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff05;overflow:hidden;position:relative}.ai-flow-visual canvas{width:100%;height:100%;display:block}.ai-flow-bars{display:grid;gap:13px}.ai-flow-row{display:grid;grid-template-columns:70px 1fr 42px;gap:9px;align-items:center;font:10px 'IBM Plex Mono',monospace;color:#b8c7d9}.ai-flow-track{height:9px;border-radius:99px;background:#ffffff0e;overflow:hidden}.ai-flow-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4cc9f0,#7c3aed,#f59e0b);transition:width 1.35s cubic-bezier(.2,.8,.2,1)}.ai-flow-note{margin-top:17px!important;color:#8294aa!important;font:10px/1.55 'IBM Plex Mono',monospace!important}.ai-flow-steps{display:flex;align-items:center;gap:0;margin-top:22px}.ai-flow-step{position:relative;display:grid;place-items:center;width:58px;height:58px;border:1px solid #ffffff1c;border-radius:50%;background:#ffffff08;font:700 9px 'IBM Plex Mono',monospace;color:#dceaff;box-shadow:0 0 24px #4cc9f018;animation:ai-step-pulse 2.8s ease-in-out infinite}.ai-flow-step:nth-child(3){animation-delay:.35s}.ai-flow-step:nth-child(5){animation-delay:.7s}.ai-flow-step:nth-child(7){animation-delay:1.05s}.ai-flow-line{height:1px;flex:1;background:linear-gradient(90deg,#4cc9f066,#7c3aed88,#f59e0b66);position:relative;overflow:hidden}.ai-flow-line:after{content:'';position:absolute;top:-2px;left:-20%;width:20%;height:5px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(1px);animation:ai-flow-scan 2.5s linear infinite}.ai-flow-label{margin-top:9px;text-align:center;font:9px 'IBM Plex Mono',monospace;color:#8194aa;text-transform:uppercase}.ai-flow-source{margin-top:15px;font:10px 'IBM Plex Mono',monospace;color:#71849a}.ai-flow-source strong{color:#b8c7d9}@keyframes ai-step-pulse{0%,100%{transform:scale(.98);box-shadow:0 0 20px #4cc9f010}50%{transform:scale(1.04);box-shadow:0 0 30px #4cc9f02b}}@keyframes ai-flow-scan{to{left:110%}}@media(max-width:700px){.ai-flow-grid{grid-template-columns:1fr}.ai-flow-top{flex-direction:column}.ai-flow-number{font-size:32px}.ai-flow-step{width:48px;height:48px;font-size:8px}}@media(prefers-reduced-motion:reduce){.ai-flow-step,.ai-flow-line:after{animation:none}.ai-flow-fill{transition:none}.ai-flow-visual{display:none}}
          '''

          top = r'''<aside class="ai-flow-card ai-flow-top-card" id="ai-flow-cards-v2" aria-label="Key AI adoption evidence">
            <div class="ai-flow-inner"><div class="ai-flow-top"><div><div class="ai-flow-kicker">Key signal · interactive evidence</div><h3>India is moving from AI experimentation to everyday work</h3><p>Among AI-using knowledge workers surveyed by Microsoft in 2026, India recorded a much larger Frontier Professional share than the global average.</p></div><div class="ai-flow-number">32%</div></div><div class="ai-flow-grid"><div class="ai-flow-visual"><canvas data-ai-flow="network"></canvas></div><div class="ai-flow-bars"><div class="ai-flow-row"><span>India</span><div class="ai-flow-track"><div class="ai-flow-fill" data-width="32"></div></div><b>32%</b></div><div class="ai-flow-row"><span>Global</span><div class="ai-flow-track"><div class="ai-flow-fill" data-width="16"></div></div><b>16%</b></div></div></div><p class="ai-flow-note">Definition matters: this is 32% of AI-using knowledge workers in the study—not 32% of all Indian workers.</p><div class="ai-flow-source"><strong>Source:</strong> Microsoft Work Trend Index 2026 · survey of 20,000 knowledge workers across 10 markets.</div></div>
          </aside>'''

          section = r'''<aside class="ai-flow-card ai-section-flow" aria-label="AI adoption to value framework">
            <div class="ai-flow-inner"><div class="ai-flow-kicker">How the argument connects</div><h3>Adoption is only the beginning</h3><p>The article's central analytical flow: more people using AI does not automatically mean more economic or institutional value. Capability, reliability and governance determine what comes next.</p><div class="ai-flow-steps"><div><div class="ai-flow-step">ADOPT</div><div class="ai-flow-label">use</div></div><div class="ai-flow-line"></div><div><div class="ai-flow-step">CAPABLE</div><div class="ai-flow-label">skills</div></div><div class="ai-flow-line"></div><div><div class="ai-flow-step">VALUE</div><div class="ai-flow-label">outcomes</div></div><div class="ai-flow-line"></div><div><div class="ai-flow-step">GOVERN</div><div class="ai-flow-label">trust</div></div></div><div class="ai-flow-source"><strong>Analytical framework:</strong> conceptual model used in this article, not a statistical series.</div></div>
          </aside>'''

          js = r'''<script>
          (function(){
            const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
            document.querySelectorAll('.ai-flow-fill').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.width+'%',220+i*180));
            if(reduce)return;
            document.querySelectorAll('canvas[data-ai-flow="network"]').forEach(c=>{
              const x=c.getContext('2d'); if(!x)return; let w=0,h=0,d=1,pts=[];
              function resize(){const r=c.getBoundingClientRect();w=Math.max(1,r.width);h=Math.max(1,r.height);d=Math.min(devicePixelRatio||1,1.5);c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);pts=Array.from({length:Math.max(18,Math.min(42,Math.floor(w*h/5000)))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));}
              function loop(t){x.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.beginPath();x.arc(p.x,p.y,1.4,0,Math.PI*2);x.fillStyle='rgba(220,235,255,.75)';x.fill()}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],q=Math.hypot(a.x-b.x,a.y-b.y);if(q<80){x.strokeStyle='rgba(76,201,240,'+(0.2*(1-q/80))+')';x.lineWidth=.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}requestAnimationFrame(loop)}
              resize();addEventListener('resize',resize,{passive:true});requestAnimationFrame(loop);
            });
          })();
          </script>'''

          if '</style>' not in s or '<div class="meta">' not in s or '</article>' not in s:
              raise SystemExit('Expected article structure not found; refusing to modify file.')
          s=s.replace('</style>',css+'</style>',1)
          s=re.sub(r'(<div class="meta">.*?</div>)',r'\1'+top,s,count=1,flags=re.S)
          s=re.sub(r'(<h2>.*?</h2>)',r'\1'+section,s,count=1,flags=re.S)
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts/ai-adoption-india.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add smooth animated AI information cards'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 3
          done
          exit 1
