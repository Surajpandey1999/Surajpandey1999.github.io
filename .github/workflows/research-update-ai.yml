name: Research update AI adoption article
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message != 'Update AI adoption article with 2026 research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update article
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('posts/ai-adoption-india.html')
          s=p.read_text(encoding='utf-8')
          if 'id="research-update-2026"' in s:
              raise SystemExit('already updated')
          s=s.replace('dateModified":"2026-09-03"','dateModified":"2026-09-03"',1)
          toc='<a href="#research-update-2026">2026 Evidence Update</a>'
          s=s.replace('<a href="#future">Future scenarios</a>', '<a href="#future">Future scenarios</a>'+toc, 1)
          block='''<section id="research-update-2026" class="research-update"><div class="eyebrow">September 2026 evidence update</div><h2>India’s AI Adoption Has Entered the Agentic Phase</h2><p class="lead">The latest evidence changes the story in an important way: India is not merely adopting AI tools at high speed. Indian workers and enterprises are increasingly redesigning workflows around AI agents while retaining human responsibility for quality, judgment and outcomes.</p><div class="stats"><div class="stat"><strong>32%</strong><span>India AI users classified as Frontier Professionals</span></div><div class="stat"><strong>16%</strong><span>Global Frontier Professional average</span></div><div class="stat"><strong>87%</strong><span>Indian respondents retaining responsibility for thinking</span></div></div><div class="card"><h3>What the newest workforce evidence says</h3><ul><li><strong>32% of India’s AI users</strong> qualify as “Frontier Professionals” in Microsoft’s 2026 Work Trend Index—twice the global average of 16% and the highest share among the ten markets studied.</li><li><strong>78%</strong> of Indian AI users say AI enables work that was not possible a year earlier, versus 58% globally; the figure rises to <strong>85%</strong> among India’s Frontier Professionals.</li><li><strong>63%</strong> rank quality control of AI output as a key skill and <strong>59%</strong> rank critical thinking highly, compared with 50% and 46% globally.</li><li><strong>34%</strong> of Indian organisations report agent workflows operating at the function level, compared with 26% globally; leadership alignment on AI is 44% in India versus 26% globally.</li><li>Enterprise deployment is moving beyond pilots: Microsoft reported more than <strong>400,000 Microsoft 365 Copilot seats</strong> across Infosys, TCS, Wipro and LTIMindtree in under six months, with reported productivity improvements varying by workflow.</li></ul></div><div class="card"><h3>India’s strategic infrastructure: from adoption to capability</h3><ul><li>The Government of India’s December 2025 PIB backgrounder reported <strong>₹10,371.92 crore</strong> allocated to the IndiaAI Mission over five years and <strong>38,000 GPUs</strong> onboarded, up from the original 10,000-GPU target.</li><li><strong>AIKosh</strong> is positioned as a national platform for datasets, models, toolkits and use cases, supporting research and application development across sectors.</li><li>The IndiaAI Compute pillar is designed to make AI compute, network, storage and platform services available at more affordable rates to researchers, students, startups, MSMEs and industry.</li><li>The Mission’s seven-pillar architecture—Compute, Datasets, Foundation Models, Future Skills, Application Development, Startup Financing, and Safe &amp; Trusted AI—shows that India’s strategy is increasingly about ecosystem capacity rather than a single flagship model.</li><li>PIB also highlights Bhashini’s multilingual infrastructure and BharatGen’s Indian-language multimodal direction as examples of India-specific AI capability.</li></ul></div><div class="card"><h3>The crucial audit finding: adoption is not the same as value</h3><p>India’s leadership should not be interpreted as proof that every AI deployment is successful. Salesforce’s 2026 India workplace study found that Indian workers were 45% more likely than the global average to say AI is part of their core workflow, but <strong>38%</strong> also reported an unsuccessful AI pilot in the previous year, compared with 28% globally. The implication is important for policy and management: India’s next challenge is not simply increasing usage, but improving reliability, workflow redesign, governance, measurement and return on investment.</p></div><div class="callout"><strong>Research synthesis:</strong> India’s comparative advantage is increasingly visible at the intersection of <em>scale + digital public infrastructure + software talent + workforce adoption + multilingual capability</em>. Its principal strategic gaps remain frontier-scale compute and model development, advanced semiconductor capacity, research depth, reliable evaluation, and mechanisms that ensure AI gains are distributed beyond high-skill and large-enterprise users.</div><div class="sourcebox"><strong>Primary and corroborating sources</strong><br><a href="https://www.pib.gov.in/PressReleasePage.aspx?PRID=2209737&amp;reg=3&amp;lang=1" target="_blank" rel="noopener">PIB — Transforming India with AI</a><br><a href="https://news.microsoft.com/source/asia/2026/09/03/indias-ai-advantage-is-human-microsoft-work-trend-index-2026-finds-india-among-the-worlds-leading-frontier-workforces/" target="_blank" rel="noopener">Microsoft — Work Trend Index 2026: India findings</a><br><a href="https://www.livemint.com/ai/india-leads-in-ai-adoption-but-workers-say-ai-output-is-a-starting-point-not-the-final-answer-11788435466783.html" target="_blank" rel="noopener">Mint — India leads in AI adoption, but workers retain final responsibility</a><br><a href="https://indiaai.gov.in/" target="_blank" rel="noopener">IndiaAI — national AI ecosystem and programmes</a><br><a href="https://aikosh.indiaai.gov.in/home/about-us/" target="_blank" rel="noopener">AIKosh — datasets, models, toolkits and use cases</a><br><a href="https://www.compute.indiaai.gov.in/login" target="_blank" rel="noopener">IndiaAI Compute — affordable AI infrastructure</a></div></section>'''
          marker='<section class="faq-wrap" id="faq">'
          if marker in s:
              s=s.replace(marker, block+marker, 1)
          else:
              s=s.replace('<footer class="footer">', block+'<footer class="footer">', 1)
          css='''.research-update{margin:72px 0 30px}.research-update h2{margin-top:18px}.research-update .card{margin:24px 0}.research-update .sourcebox{margin-top:28px}.research-update .sourcebox a{display:block;margin:7px 0}@media(max-width:520px){.research-update{margin-top:50px}}'''
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ai-adoption-india.html
          git diff --cached --quiet || git commit -m "Update AI adoption article with 2026 research"
          git push
