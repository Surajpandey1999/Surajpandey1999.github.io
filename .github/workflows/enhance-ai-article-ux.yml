name: Enhance AI article FAQ share CTA UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    if: github.event.head_commit.message != 'Enhance AI article with FAQ share and work CTA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance article
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('posts/ai-adoption-india.html')
          s=p.read_text(encoding='utf-8')
          if 'id="faq"' in s and 'class="work-cta"' in s:
              print('Enhancements already present')
              raise SystemExit

          css='''.faq-wrap{margin:70px 0 30px}.faq-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.faq-head h2{border:0;margin:0;padding:0}.faq-kicker{font:700 10px 'IBM Plex Mono',monospace;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);margin-bottom:8px}.faq-list{display:grid;gap:10px}.faq-item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s ease}.faq-item:hover{border-color:#b8aa96;box-shadow:0 12px 35px #382b1b0d}.faq-item summary{cursor:pointer;list-style:none;padding:20px 54px 20px 20px;position:relative;font:600 16px/1.45 'IBM Plex Sans',sans-serif;color:var(--ink)}.faq-item summary::-webkit-details-marker{display:none}.faq-item summary:after{content:'+';position:absolute;right:20px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eee7db;color:var(--blue);font:600 20px 'IBM Plex Sans',sans-serif;transition:.25s}.faq-item[open] summary:after{content:'−';background:var(--blue);color:#fff}.faq-answer{padding:0 20px 20px;border-top:1px solid transparent}.faq-item[open] .faq-answer{border-top-color:var(--line);padding-top:16px}.faq-answer p{margin:0;font:15px/1.75 'IBM Plex Sans',sans-serif!important;color:#4c4943!important}.engage{margin:48px 0 26px;padding:26px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fffdf8,#f0e9de);box-shadow:0 20px 55px #2e241612}.engage-top{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}.engage h3{margin:0 0 7px;font-size:1.5rem}.engage p{margin:0!important;font:14px/1.65 'IBM Plex Sans',sans-serif!important;color:var(--muted)!important}.share-actions{display:flex;gap:8px;flex-wrap:wrap}.share-btn,.copy-btn{appearance:none;border:1px solid #cfc5b7;background:#fff;color:var(--ink);padding:11px 15px;border-radius:10px;text-decoration:none;cursor:pointer;font:700 12px 'IBM Plex Sans',sans-serif;transition:.2s ease}.share-btn:hover,.copy-btn:hover{transform:translateY(-2px);border-color:var(--blue);color:var(--blue);box-shadow:0 8px 22px #174b7a12}.copy-btn.copied{background:#e6f2ea;border-color:#9fc7ab;color:#24613a}.work-cta{position:relative;margin:30px 0 22px;padding:clamp(26px,5vw,48px);overflow:hidden;border-radius:24px;background:#07101c;color:#fff;border:1px solid #ffffff1c;box-shadow:0 28px 80px #07101c35}.work-cta:before{content:'';position:absolute;inset:-40%;background:radial-gradient(circle at 25% 30%,#174b7a70,transparent 30%),radial-gradient(circle at 80% 70%,#b4530950,transparent 28%);pointer-events:none}.work-inner{position:relative;z-index:1;max-width:690px}.case-label{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #ffffff28;border-radius:99px;background:#ffffff0b;font:700 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1.2px;color:#dbeafe}.case-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px #22c55e20}.work-cta h2{border:0;padding:0;margin:18px 0 12px;color:#fff;font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.035em}.work-cta p{color:#c7d0dc!important;font:16px/1.75 'IBM Plex Sans',sans-serif!important;max-width:650px}.work-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.work-primary,.work-secondary{display:inline-flex;align-items:center;justify-content:center;padding:13px 17px;border-radius:11px;text-decoration:none;font:700 13px 'IBM Plex Sans',sans-serif;transition:.2s ease}.work-primary{background:#fff;color:#07101c}.work-secondary{border:1px solid #ffffff35;color:#fff;background:#ffffff0b}.work-primary:hover,.work-secondary:hover{transform:translateY(-2px)}.back-all{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:28px 0 10px;padding:17px 0;border-block:1px solid var(--line);font:700 12px 'IBM Plex Sans',sans-serif}.back-all a{text-decoration:none;color:var(--blue)}.back-all span{color:var(--muted);font-weight:500}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:9999;background:#07101c;color:#fff;padding:11px 15px;border-radius:10px;font:600 12px 'IBM Plex Sans',sans-serif;box-shadow:0 12px 40px #0005;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.faq-item summary{padding:17px 50px 17px 16px;font-size:14px}.faq-answer{padding-left:16px;padding-right:16px}.engage{padding:20px}.share-actions,.share-btn,.copy-btn,.work-actions,.work-primary,.work-secondary{width:100%}.share-btn,.copy-btn{text-align:center}.back-all{align-items:flex-start;flex-direction:column}.work-cta{border-radius:18px}}'''
          s=s.replace('</style>',css+'</style>',1)

          s=s.replace('<a href="#future">Future scenarios</a><a href="#sources">Sources</a>','<a href="#future">Future scenarios</a><a href="#sources">Sources</a><a href="#faq">FAQ</a>',1)

          block='''<section class="faq-wrap" id="faq"><div class="faq-head"><div><div class="faq-kicker">Frequently Asked Questions</div><h2>AI adoption, India and politics — answered</h2></div></div><div class="faq-list"><details class="faq-item"><summary>Why is Artificial Intelligence adoption accelerating so quickly?</summary><div class="faq-answer"><p>AI adoption is accelerating because capable models are now accessible through ordinary software, cloud platforms and APIs. Organizations no longer need to build every AI system from scratch. Falling access barriers, strong investment, better models and clear productivity use cases are pushing AI into everyday workflows much faster than earlier technology cycles.</p></div></details><details class="faq-item"><summary>Where does India currently stand in the global AI race?</summary><div class="faq-answer"><p>India is strongest in digital scale, software talent, market size and rapidly growing AI adoption. It is also building public AI infrastructure through the IndiaAI Mission, IndiaAI Compute and AIKosh. However, India is still developing deeper frontier-model capability, research depth, advanced semiconductor capacity and large-scale domestic compute. Its strategic opportunity is to convert adoption strength into durable innovation and research capacity.</p></div></details><details class="faq-item"><summary>What are the biggest benefits of AI for India?</summary><div class="faq-answer"><p>The largest opportunities include productivity gains, multilingual public services, healthcare and education assistance, scientific research, agriculture, startup innovation and more efficient government workflows. India's linguistic diversity also makes translation, speech and locally adapted AI particularly valuable.</p></div></details><details class="faq-item"><summary>What are the major political risks of rapid AI adoption?</summary><div class="faq-answer"><p>The central political risks include misinformation and synthetic media, surveillance, privacy loss, algorithmic bias, labour-market disruption, unequal access to compute and concentration of technological power. These risks matter because AI can influence not only markets but also elections, public administration, rights and the distribution of power.</p></div></details><details class="faq-item"><summary>How can AI be used in Political Science?</summary><div class="faq-answer"><p>Political Science can use AI for literature analysis, coding large text datasets, translation, public-opinion research, policy comparison and administrative-data analysis. At the same time, AI itself is becoming a subject of Political Science because it affects state capacity, democracy, political communication, political economy, surveillance and international relations.</p></div></details><details class="faq-item"><summary>What does AI sovereignty mean for India?</summary><div class="faq-answer"><p>AI sovereignty means retaining meaningful national capacity to access compute, build and evaluate models, govern critical deployments, protect important data and avoid excessive dependence on a single foreign technology provider. It does not require isolation; it means preserving strategic choice and institutional control while remaining globally connected.</p></div></details></div></section><section class="engage" aria-label="Share this research"><div class="engage-top"><div><h3>Found this research useful?</h3><p>Share it with students, researchers, policy professionals and anyone following India's AI transition.</p></div><div class="share-actions"><a class="share-btn" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fsurajpandey1999.github.io%2Fposts%2Fai-adoption-india.html">Share on LinkedIn</a><a class="share-btn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=https%3A%2F%2Fsurajpandey1999.github.io%2Fposts%2Fai-adoption-india.html&text=Rapid%20Artificial%20Intelligence%20Adoption%3A%20Pros%2C%20Cons%20and%20Where%20Does%20India%20Stand%3F%20%7C%20Suraj%20Pandey">Share on X</a><button class="copy-btn" id="copyArticle" type="button">Copy Article Link</button></div></div></section><section class="work-cta" aria-label="Work with Suraj Pandey"><div class="work-inner"><span class="case-label"><span class="case-dot"></span>Open Case — Work With Me</span><h2>Need research-backed writing like this for your platform?</h2><p>I research and write long-form, well-sourced pieces on public policy, governance, technology, AI, geopolitics and public affairs — plus resumes, LinkedIn profiles and AI-assisted content for professionals and businesses. If this piece read well, that's the standard I bring to client work too.</p><div class="work-actions"><a class="work-primary" href="../services.html">See Services →</a><a class="work-secondary" href="../contact.html">Get In Touch →</a></div></div></section><div class="back-all"><a href="../blog.html">← Back to all articles</a><span>Politics · Artificial Intelligence · Geopolitics</span></div><div class="toast" id="copyToast" role="status" aria-live="polite">Article link copied</div>'''

          marker='<footer class="footer">'
          s=s.replace(marker,block+marker,1)

          faq_schema='''<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why is Artificial Intelligence adoption accelerating so quickly?","acceptedAnswer":{"@type":"Answer","text":"AI adoption is accelerating because capable models are increasingly accessible through ordinary software, cloud platforms and APIs, lowering deployment barriers while investment and productivity use cases grow."}},{"@type":"Question","name":"Where does India currently stand in the global AI race?","acceptedAnswer":{"@type":"Answer","text":"India is strong in digital scale, software talent, market size and adoption, while continuing to develop frontier-model capability, research depth, advanced semiconductor capacity and large-scale domestic compute."}},{"@type":"Question","name":"What are the major political risks of rapid AI adoption?","acceptedAnswer":{"@type":"Answer","text":"Major political risks include misinformation, synthetic media, surveillance, privacy loss, algorithmic bias, labour disruption, unequal access to compute and concentration of technological power."}},{"@type":"Question","name":"How can AI be used in Political Science?","acceptedAnswer":{"@type":"Answer","text":"AI can support literature analysis, text coding, translation, public-opinion research, policy comparison and administrative-data analysis, while AI itself is also a subject of Political Science."}},{"@type":"Question","name":"What does AI sovereignty mean for India?","acceptedAnswer":{"@type":"Answer","text":"AI sovereignty means maintaining meaningful national capacity to access compute, build and evaluate models, govern critical deployments, protect important data and preserve strategic choice."}}]}</script>'''
          s=s.replace('</head>',faq_schema+'</head>',1)

          js=""";const copyBtn=document.getElementById('copyArticle'),copyToast=document.getElementById('copyToast');if(copyBtn){copyBtn.addEventListener('click',async()=>{const url='https://surajpandey1999.github.io/posts/ai-adoption-india.html';try{await navigator.clipboard.writeText(url);copyBtn.textContent='Copied ✓';copyBtn.classList.add('copied');if(copyToast){copyToast.classList.add('show');setTimeout(()=>copyToast.classList.remove('show'),1800)}setTimeout(()=>{copyBtn.textContent='Copy Article Link';copyBtn.classList.remove('copied')},2200)}catch(e){window.prompt('Copy this article link:',url)}})}"""
          s=s.replace('</script></body></html>',js+'</script></body></html>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/ai-adoption-india.html
          git diff --cached --quiet || git commit -m "Enhance AI article with FAQ share and work CTA"
          git push
