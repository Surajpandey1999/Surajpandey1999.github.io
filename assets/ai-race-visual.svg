<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">OpenAI and Anthropic frontier AI comparison</title>
<desc id="desc">An abstract animated editorial visual showing two frontier AI systems moving toward an AGI horizon.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#111827"/><stop offset=".5" stop-color="#64748b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="700" rx="38" fill="url(#bg)"/>
<circle cx="190" cy="100" r="110" fill="#111827" opacity=".05" filter="url(#blur)"/>
<circle cx="1020" cy="580" r="130" fill="#d97706" opacity=".06" filter="url(#blur)"/>
<path d="M240 350 C430 210 770 490 960 350" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 14">
  <animate attributeName="stroke-dashoffset" from="0" to="-104" dur="3s" repeatCount="indefinite"/>
</path>
<g filter="url(#shadow)">
 <rect x="80" y="210" width="330" height="250" rx="28" fill="#fff" stroke="#e2e8f0"/>
 <rect x="790" y="210" width="330" height="250" rx="28" fill="#fff" stroke="#e2e8f0"/>
</g>
<g font-family="Inter,Arial,sans-serif" fill="#0f172a">
 <text x="120" y="260" font-size="14" font-weight="700" letter-spacing="2">FRONTIER SYSTEM</text>
 <text x="120" y="330" font-size="42" font-weight="800">OPENAI</text>
 <text x="120" y="365" font-size="17" fill="#64748b">Agents · compute · reasoning</text>
 <text x="830" y="260" font-size="14" font-weight="700" letter-spacing="2">FRONTIER SYSTEM</text>
 <text x="830" y="330" font-size="42" font-weight="800">ANTHROPIC</text>
 <text x="830" y="365" font-size="17" fill="#64748b">Claude · safety · agents</text>
 <text x="600" y="120" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" fill="#475569">THE RACE BEYOND AI</text>
 <text x="600" y="600" text-anchor="middle" font-size="34" font-weight="800">From models to autonomous systems</text>
</g>
<g fill="#111827"><circle cx="160" cy="405" r="7"><animate attributeName="cy" values="405;395;405" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="870" cy="405" r="7" fill="#d97706"><animate attributeName="cy" values="405;395;405" dur="2.7s" repeatCount="indefinite"/></circle></g>
</svg>
